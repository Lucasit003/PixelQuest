<!DOCTYPE html><html><head><meta charset="utf-8"><title>Gate shots</title>
<style>body{background:#14100f;color:#ddd;font:11px monospace;margin:0;padding:8px;white-space:pre}</style></head>
<body><div id="out">…</div>
<script type="module">
async function purge(dir){const h=await (await fetch(dir+'?v='+Date.now(),{cache:'reload'})).text();
  const n=[...h.matchAll(/href="([^"?]+)"/g)].map(m=>decodeURIComponent(m[1]));
  await Promise.all(n.map(x=>{if(x.startsWith('/')||x.startsWith('.'))return null;
    if(x.endsWith('/'))return purge(dir+x);return x.endsWith('.js')?fetch(dir+x,{cache:'reload'}):null;}));}
await purge('./src/');
let __s=0x9e3779b9;const rs=(s)=>{__s=s>>>0;};
Math.random=function(){__s|=0;__s=(__s+0x6D2B79F5)|0;let t=Math.imul(__s^(__s>>>15),1|__s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};
performance.now=()=>4200;
const b='?v='+Date.now();
const { TownScene }=await import('./src/scenes/town.js'+b);
const { Hero }=await import('./src/game/state.js'+b);
const { openRoadGates }=await import('./src/scenes/town/passability.js'+b);
const W=480,H=270;
const cv=document.createElement('canvas');cv.width=W;cv.height=H;
const g=cv.getContext('2d',{willReadFrequently:true});
const sc=new TownScene(Hero.create('warrior'),{});
sc.enter({width:W,height:H});
await new Promise(r=>setTimeout(r,2600));
const FC=sc.plazaFocus;
const out=[];const say=(s)=>{out.push(s);document.getElementById('out').textContent=out.join('\n');};
say('gates: '+JSON.stringify(sc._gates));

// keep a pristine copy of the solids so we can render the BEFORE state too
const carved = sc.solids.map(s=>({...s}));

function shot(dx,dy,z,overlay){
  let prev=0,run=0;
  for(let i=0;i<40 && run<3;i++){
    rs(0x1234); window.__noCull=false; window.__townZoom=z; window.__townNight=false;
    sc.px=FC.x+dx; sc.py=FC.y+dy; sc.t=7.5;
    g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,H); sc.draw(g);
    const d=g.getImageData(0,0,W,H).data;
    let h=0x811c9dc5; for(let k=0;k<d.length;k+=97){h^=d[k];h=Math.imul(h,0x01000193);}
    h=h>>>0; if(h===prev)run++; else {run=1;prev=h;}
  }
  if(overlay){
    // paint every collision box so the gate is visible as a hole in the wall
    const camX=sc.camX, camY=sc.camY;
    g.save(); g.scale(z,z); g.translate(-Math.round(camX),-Math.round(camY));
    g.fillStyle='rgba(255,60,60,0.45)';
    for(const s of sc.solids) if(Number.isFinite(s.x)) g.fillRect(s.x,s.y,s.w,s.h);
    g.restore();
  }
  return new Promise(r=>cv.toBlob(r,'image/png'));
}
const SHOTS=[['wall',700,-790,1.10],['wall_solids',700,-790,1.10],['approach',640,-700,0.60],['approach_solids',640,-700,0.60]];
for(const [id,dx,dy,z] of SHOTS){
  const bl=await shot(dx,dy,z,/solids/.test(id));
  await fetch('http://127.0.0.1:8479/gate_'+id+'.png',{method:'POST',body:bl});
  say(id+' done');
}
say('DONE');
</script></body></html>
