<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PixelQuest — Train Your Hero</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <!-- The drawing buffer is 2x the logical size. Every scene still draws in
     480x270 coordinates; core/loop.js applies the 2x transform once per
     frame. So the UI needs no rescaling and high-resolution art gets
     sharper for free. -->
    <canvas id="game" width="960" height="540"></canvas>
  </div>
  <div id="rotate">Rotate your device or widen the window.</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
