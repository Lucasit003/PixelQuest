<!DOCTYPE html><html><head><meta charset="utf-8"><title>Road review</title>
<style>body{background:#14100f;color:#ddd;font:11px monospace;margin:0;padding:8px;white-space:pre}</style></head>
<body><div id="out">…</div>
<script type="module">
async function purge(dir){const h=await (await fetch(dir+'?v='+Date.now(),{cache:'reload'})).text();
  const n=[...h.matchAll(/href="([^"?]+)"/g)].map(m=>decodeURIComponent(m[1]));
  await Promise.all(n.map(x=>{if(x.startsWith('/')||x.startsWith('.'))return null;
    if(x.endsWith('/'))return purge(dir+x);return x.endsWith('.js')?fetch(dir+x,{cache:'reload'}):null;}));}
await purge('./src/');
let __s=0x9e3779b9;const rs=(s)=>{__s=s>>>0;};
Math.random=function(){__s|=0;__s=(__s+0x6D2B79F5)|0;let t=Math.imul(__s^(__s>>>15),1|__s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};
performance.now=()=>4200;
const b='?v='+Date.now();
const { TownScene }=await import('./src/scenes/town.js'+b);
const { Hero }=await import('./src/game/state.js'+b);
const W=480,H=270;
const cv=document.createElement('canvas');cv.width=W;cv.height=H;
const g=cv.getContext('2d',{willReadFrequently:true});
const sc=new TownScene(Hero.create('warrior'),{});
sc.enter({width:W,height:H});
await new Promise(r=>setTimeout(r,2600));
const FC=sc.plazaFocus, D=sc.districts;
const out=[];const say=(s)=>{out.push(s);document.getElementById('out').textContent=out.join('\n');};
say('road rects on the map: '+(sc.roads||[]).length);
const SHOTS=[
  ['junction',  FC.x,             FC.y + 30,        1.10],  // where the roads meet the square
  ['detail',    FC.x - 30,        FC.y + 210,       2.60],  // paving detail, south approach
  ['run_south', FC.x + 40,        FC.y + 620,       1.10],  // a long run away from the plaza
  ['run_north', FC.x,             FC.y - 640,       1.10],  // the north road
  ['market',    D.market.x,       D.market.y - 120, 1.10],  // road into the market district
  ['network',   FC.x,             FC.y + 120,       0.42],  // the whole network shape
];
const hash2=(p)=>{let h=0x811c9dc5;for(let i=0;i<p.length;i++){h^=p[i];h=Math.imul(h,0x01000193);}return h>>>0;};
for(const [id,x,y,z] of SHOTS){
  let prev=0,run=0,n=0;
  for(let i=0;i<40 && run<3;i++){
    rs(0x1234); window.__noCull=false; window.__townZoom=z; window.__townNight=false;
    sc.px=x; sc.py=y; sc.t=7.5;
    g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,H); sc.draw(g);
    const hh=hash2(g.getImageData(0,0,W,H).data); n++;
    if(hh===prev)run++; else {run=1;prev=hh;}
  }
  const bl=await new Promise(r=>cv.toBlob(r,'image/png'));
  await fetch('http://127.0.0.1:8479/road_'+id+'.png',{method:'POST',body:bl});
  say(id.padEnd(10)+' stable after '+n+' draws');
}
say('DONE');
</script></body></html>
