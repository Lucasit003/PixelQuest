  drawRig(g, C, W, 200, 380, 1.0, hiddenSlots('bo', C.cur, t));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const holder = document.getElementById('btns');
for (const nm of ['idle', 'walk', 'attack', 'hurt', 'down']) {
  const b = document.createElement('button');
  b.textContent = nm;
  if (nm === 'idle') b.classList.add('on');
  b.onclick = () => {
    CHARS.bo.cur = nm; CHARS.bo.t0 = performance.now();
    holder.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  };
  holder.appendChild(b);
}
window.__grab = async (ck, anim, times, tag) => {
  const C = CHARS[ck];
  const cw = 300, chh = 400;
  const c = document.createElement('canvas');
  c.width = times.length * cw; c.height = chh;
  const g = c.getContext('2d');
  g.fillStyle = '#33402a'; g.fillRect(0, 0, c.width, c.height);
  times.forEach((tt, i) => {
    const W = worldTransforms(C, pose(C, C.anims[anim], tt));
    drawRig(g, C, W, 140 + i * cw, 385, 1.0, hiddenSlots(ck, anim, tt));
    g.fillStyle = '#e8e4d8'; g.font = '12px Menlo';
    g.fillText(ck + ' ' + anim + ' t=' + tt.toFixed(2), 8 + i * cw, 16);
  });
  return new Promise(r => c.toBlob(b =>
    fetch('/shot?name=' + tag, { method: 'POST', body: b }).then(() => r(tag))));
};
