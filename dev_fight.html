<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PixelQuest — Goblin Fight (auto-boot)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0a12; display: flex;
                 align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; width: 96vw; max-height: 96vh;
             aspect-ratio: 16 / 9; }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="270"></canvas>
  <script type="module">
    import './src/main.js';
    // Auto-drive: as soon as frames actually flow (page visible), skip the
    // menus and drop into the dungeon with goblins closing in.
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    async function boot() {
      for (let i = 0; i < 100 && !window.PQDev; i++) await wait(150);
      if (!window.PQDev) return;
      // wait until rAF is alive (tab visible) so transitions can play
      let alive = false;
      while (!alive) {
        const t0 = await new Promise((r) => requestAnimationFrame(r));
        alive = true;
      }
      window.PQDev.start('warrior');
      await wait(1100);
      window.PQDev.dungeon();
      for (let i = 0; i < 40; i++) {
        await wait(400);
        const sc = window.__game && window.__game.scene;
        if (sc && sc._spawnEnemy) {
          sc._spawnEnemy('risen_footman', sc.camX + 200, 180);
          sc._spawnEnemy('risen_archer', sc.camX + 250, 200);
          sc._spawnEnemy('gob_bomber', sc.camX + 280, 170);
          sc._spawnEnemy('goblin', sc.camX + 225, 165);
          break;
        }
      }
    }
    boot();
  </script>
</body>
</html>
