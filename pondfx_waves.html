<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Pond waves</title>
<style>
  body { background:#14100f; color:#eee; font:11px monospace; margin:0; padding:6px; }
  canvas { image-rendering: pixelated; display:block; }
  .row { display:flex; gap:5px; flex-wrap:wrap; align-items:flex-start; }
  .cell { margin:0 0 6px 0; }
  .lbl { padding:1px 0; color:#ffcc66; }
  h3 { color:#8fd8ff; font-size:12px; margin:8px 0 4px; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
// cache-busted so edits to waterfx.js show up on a plain reload
const { buildWaterMask, proceduralRipples } = await import('./src/gfx/waterfx.js?v=' + Date.now());

// Mirrors the wave timing in waterfx.js so we can locate a breaking wave
// instead of hunting for one by eye.
function hash(x) { const s = Math.sin(x * 12.9898) * 43758.5453; return s - Math.floor(s); }
const WV = 5;
function wavesAt(t, info, worldW, worldH) {
  const list = [];
  for (let i = 0; i < WV; i++) {
    const period = 3.4 + i * 0.9;
    const loop = Math.floor((t + i * 9.7) / period);
    const phase = ((t + i * 9.7) % period) / period;
    const anchorIdx = Math.floor(hash(i * 4.3 + loop * 2.9 + 90) * info.shore.length);
    const [ax, ay] = info.shore[anchorIdx];
    list.push({
      i, phase,
      x: ax * (worldW / info.w),
      y: ay * (worldH / info.h),
    });
  }
  return list;
}

const img = new Image();
img.src = 'assets/pond.png';
await img.decode();
const info = buildWaterMask(img);

const GW = 816, GH = 400;
const off = document.createElement('canvas');
off.width = GW; off.height = GH;
const og = off.getContext('2d');
og.imageSmoothingEnabled = false;

function renderAt(t) {
  og.drawImage(img, 0, 0, GW, GH);
  proceduralRipples(og, info, 0, 0, GW, GH, t);
}

const out = document.getElementById('out');

function filmstrip(title, times, cx, cy, sw, sh, Z) {
  const h = document.createElement('h3');
  h.textContent = title;
  out.appendChild(h);
  const row = document.createElement('div');
  row.className = 'row';
  out.appendChild(row);
  for (const { t, tag } of times) {
    renderAt(t);
    const sx = Math.max(0, Math.min(GW - sw, Math.round(cx - sw / 2)));
    const sy = Math.max(0, Math.min(GH - sh, Math.round(cy - sh / 2)));
    const zc = document.createElement('canvas');
    zc.width = sw * Z; zc.height = sh * Z;
    const zg = zc.getContext('2d');
    zg.imageSmoothingEnabled = false;
    zg.drawImage(off, sx, sy, sw, sh, 0, 0, zc.width, zc.height);
    const cell = document.createElement('div');
    cell.className = 'cell';
    const l = document.createElement('div');
    l.className = 'lbl'; l.textContent = tag;
    cell.appendChild(l); cell.appendChild(zc);
    row.appendChild(cell);
  }
}

// --- bubble cluster: find one rising in open water and follow it ---
{
  const inW = (dx, dy) => {
    const sx = Math.round(dx * (info.w / GW)), sy = Math.round(dy * (info.h / GH));
    if (sx < 0 || sy < 0 || sx >= info.w || sy >= info.h) return false;
    return info.mask[sy * info.w + sx] === 1;
  };
  let b = null;
  for (let t = 0; t < 120 && !b; t += 1 / 30) {
    for (let i = 0; i < 5; i++) {
      const period = 4.5 + i * 1.3;
      const loop = Math.floor((t + i * 11) / period);
      const phase = ((t + i * 11) % period) / period;
      if (phase < 0.3 || phase > 0.45) continue;
      const px = hash(i * 21.3 + loop * 5.1) * GW;
      const py = 16 + hash(i * 14.7 + loop * 8.3 + 1) * (GH - 32);
      if (!inW(px, py)) continue;
      let open = true;
      for (let dx = -24; dx <= 24 && open; dx += 12) {
        for (let dy = -18; dy <= 18 && open; dy += 9) if (!inW(px + dx, py + dy)) open = false;
      }
      if (!open) continue;
      b = { t, x: px, y: py };
      break;
    }
  }
  if (b) {
    filmstrip('BUBBLE CLUSTER rising then popping (zoom 6x)',
      [{ t: b.t - 0.6, tag: 'rising' }, { t: b.t + 0.2, tag: 'mid' },
       { t: b.t + 0.75, tag: 'near surface' }, { t: b.t + 1.5, tag: 'popped -> ring' }],
      b.x, b.y, 76, 50, 6);
  }
}

// Find a wave whose whole break we can follow: scan t for wave i entering its
// cycle, then sample that same cycle from surge through recede.
let found = null;
for (let t = 0; t < 40 && !found; t += 1 / 30) {
  for (const w of wavesAt(t, info, GW, GH)) {
    if (w.phase > 0.02 && w.phase < 0.06) {
      const period = 3.4 + w.i * 0.9;
      found = { i: w.i, tStart: t, period, x: w.x, y: w.y };
      break;
    }
  }
}

if (found) {
  const { period, tStart, x, y } = found;
  // phases: 0.10 surge, 0.30 rising, 0.45 breaking, 0.55 peak-hold, 0.72 receding, 0.90 gone
  const marks = [
    { p: 0.10, tag: 'surging in' },
    { p: 0.30, tag: 'rising' },
    { p: 0.45, tag: 'BREAKING' },
    { p: 0.58, tag: 'crest' },
    { p: 0.75, tag: 'receding' },
    { p: 0.92, tag: 'gone' },
  ];
  const times = marks.map(m => ({ t: tStart + (m.p - 0.04) * period, tag: m.tag + '  ' + m.p.toFixed(2) }));
  filmstrip('ONE WAVE, FULL BREAK (zoom 5x, centred on the wave)', times, x, y, 96, 64, 5);
  filmstrip('SAME WAVE, WIDER CONTEXT (zoom 2x)', times, x, y, 240, 150, 2);
}

// A few different waves at their breaking moment, around the pond
const peaks = [];
for (let t = 0; t < 40 && peaks.length < 6; t += 1 / 30) {
  for (const w of wavesAt(t, info, GW, GH)) {
    if (w.phase > 0.44 && w.phase < 0.47) {
      if (!peaks.some(p => Math.hypot(p.x - w.x, p.y - w.y) < 90)) {
        peaks.push({ t, x: w.x, y: w.y });
      }
    }
  }
}
if (peaks.length) {
  const h = document.createElement('h3');
  h.textContent = 'DIFFERENT WAVES BREAKING AT DIFFERENT SPOTS (zoom 4x)';
  out.appendChild(h);
  const row = document.createElement('div');
  row.className = 'row';
  out.appendChild(row);
  for (const pk of peaks) {
    renderAt(pk.t);
    const sw = 110, sh = 70, Z = 4;
    const sx = Math.max(0, Math.min(GW - sw, Math.round(pk.x - sw / 2)));
    const sy = Math.max(0, Math.min(GH - sh, Math.round(pk.y - sh / 2)));
    const zc = document.createElement('canvas');
    zc.width = sw * Z; zc.height = sh * Z;
    const zg = zc.getContext('2d');
    zg.imageSmoothingEnabled = false;
    zg.drawImage(off, sx, sy, sw, sh, 0, 0, zc.width, zc.height);
    const cell = document.createElement('div');
    cell.className = 'cell';
    const l = document.createElement('div');
    l.className = 'lbl'; l.textContent = 't=' + pk.t.toFixed(2) + 's';
    cell.appendChild(l); cell.appendChild(zc);
    row.appendChild(cell);
  }
}

window.__ready = true;
window.__found = found;
window.__peaks = peaks.length;
</script>
</body>
</html>
