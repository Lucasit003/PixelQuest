<!DOCTYPE html><html><head><meta charset="utf-8"><title>Which props sway</title>
<style>body{background:#14100f;color:#ddd;font:11px monospace;margin:0;padding:8px;white-space:pre-wrap}</style></head>
<body><div id="out">running…</div>
<script type="module">
async function purge(dir){const h=await (await fetch(dir+'?v='+Date.now(),{cache:'reload'})).text();
  const n=[...h.matchAll(/href="([^"?]+)"/g)].map(m=>decodeURIComponent(m[1]));
  await Promise.all(n.map(x=>{if(x.startsWith('/')||x.startsWith('.'))return null;
    if(x.endsWith('/'))return purge(dir+x);return x.endsWith('.js')?fetch(dir+x,{cache:'reload'}):null;}));}
await purge('./src/');
let __s=0x9e3779b9;const rs=(s)=>{__s=s>>>0;};
Math.random=function(){__s|=0;__s=(__s+0x6D2B79F5)|0;let t=Math.imul(__s^(__s>>>15),1|__s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};
let NOW=1500; performance.now=()=>NOW;
const b='?v='+Date.now();
const { swayFor } = await import('./src/scenes/town/primitives.js'+b);
const { TownScene }=await import('./src/scenes/town.js'+b);
const { Hero }=await import('./src/game/state.js'+b);
const W=480,H=270;
const cv=document.createElement('canvas');cv.width=W;cv.height=H;
const g=cv.getContext('2d',{willReadFrequently:true});
const sc=new TownScene(Hero.create('warrior'),{});
sc.enter({width:W,height:H});
await new Promise(r=>setTimeout(r,2600));
const out=[];const say=(s)=>{out.push(s);document.getElementById('out').textContent=out.join('\n');};

// every distinct decor name in the built world, classified
const names=[...new Set(sc.decor.map(d=>d.name))].sort();
const sways=names.filter(n=>swayFor(n)), still=names.filter(n=>!swayFor(n));
const counts={}; for(const d of sc.decor) counts[d.name]=(counts[d.name]||0)+1;
const tally=(list)=>list.reduce((a,n)=>a+counts[n],0);
say('distinct decor names: '+names.length);
say('  SWAY  '+sways.length+' names / '+tally(sways)+' props');
say('  STILL '+still.length+' names / '+tally(still)+' props');
say('');
const cat=(re)=>names.filter(n=>re.test(n));
for(const [label,re] of [['trees',/^(tree_|deciduous|pine_tree|myst_tree|mystic_tree)/],
                         ['banners/fabric',/^(banner|flag|clothes_line|laundry_line|awning)/],
                         ['bushes',/^(bush|nv_bush|myst_bush|topiary|hedge)/],
                         ['grass/fern/reed',/^(grass_|wetgrass|rockgrass|nv_tallgrass|nv_weeds|weeds_|cattail|reed|waterleaf|fernbank|fern_)/],
                         ['flowers',/^(flower|grass_bloom|leafplant|mushroom|myst_flower)/],
                         ['crops',/^(crop_|wheat)/]]) {
  const g2=cat(re);
  const moving=g2.filter(n=>swayFor(n));
  say(label.padEnd(18)+String(g2.length).padStart(3)+' names, '+String(tally(g2)).padStart(5)+' props  ->  '+
      (moving.length===0?'ALL STILL':(moving.length===g2.length?'ALL SWAY':moving.length+' of '+g2.length+' sway')));
}
say('');
// draw-call cost: how many drawImage calls does a swaying scene take now?
let calls=0; const real=CanvasRenderingContext2D.prototype.drawImage;
CanvasRenderingContext2D.prototype.drawImage=function(...a){calls++;return real.apply(this,a);};
const E=sc.locations.find(l=>l.id==='eldertree');
function draw(ms){rs(0x1234);NOW=ms;window.__noCull=false;window.__townZoom=1.10;window.__townNight=false;
  sc.px=E.dx;sc.py=E.dy;sc.t=7.5;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);calls=0;sc.draw(g);return calls;}
for(let i=0;i<6;i++) draw(1000);
let mn=1e9,mx=0,sum=0;
for(let i=0;i<24;i++){const c=draw(i*260); mn=Math.min(mn,c);mx=Math.max(mx,c);sum+=c;}
say('glade drawImage calls over a full gust cycle: min '+mn+'  max '+mx+'  avg '+Math.round(sum/24));
const t0=performance.now?0:0;
const rn=window.__realNow||(()=>Date.now());
let a=Date.now(); for(let i=0;i<40;i++) draw(i*130); const ms=(Date.now()-a)/40;
say('glade frame time: '+ms.toFixed(2)+' ms');
say('');say('DONE');
</script></body></html>
