    im.src = 'data:image/png;base64,' + C.p64[nm];
    C.imgs[nm] = im;
  }
  C.anims = C.cfg.custom_animations;
  C.t0 = performance.now();
}
function bez(c, x) {
  let lo = 0, hi = 1;
  for (let i = 0; i < 22; i++) {
    const m = (lo + hi) / 2, u = 1 - m;
    const px = 3*u*u*m*c[0] + 3*u*m*m*c[2] + m*m*m;
    if (px < x) lo = m; else hi = m;
  }
  const m = (lo + hi) / 2, u = 1 - m;
  return 3*u*u*m*c[1] + 3*u*m*m*c[3] + m*m*m;
}
function sample(kfs, t, field) {
  if (!kfs || !kfs.length) return 0;
  if (t <= kfs[0].time) return kfs[0][field] ?? 0;
  for (let i = 0; i < kfs.length - 1; i++) {
    const a = kfs[i], b = kfs[i+1];
    if (t >= a.time && t <= b.time) {
      const span = b.time - a.time || 1e-6;
      const f = bez(a.curve || [0.25,0,0.75,1], (t - a.time) / span);
      const av = a[field] ?? 0, bv = b[field] ?? 0;
      return av + (bv - av) * f;
    }
  }
  return kfs[kfs.length-1][field] ?? 0;
}
function duration(anim) {
  let d = 0;
  for (const bn in anim.bones) for (const ch in anim.bones[bn])
    for (const k of anim.bones[bn][ch]) d = Math.max(d, k.time);
  return d;
}
function pose(C, anim, t) {
  const out = {};
  for (const b of C.cfg.bones) {
    const tr = anim.bones[b.name] || {};
    out[b.name] = {
      rot: tr.rotate ? sample(tr.rotate, t, 'angle') : 0,
      dx: tr.translate ? sample(tr.translate, t, 'x') : 0,
      dy: tr.translate ? sample(tr.translate, t, 'y') : 0,
    };
  }
  return out;
}
function worldTransforms(C, p) {
  const W = {};
  for (const b of C.cfg.bones) {
    const par = b.parent ? W[b.parent] : { x: 0, y: 0, rot: 0 };
    const a = p[b.name];
    const lx = (b.x || 0) + a.dx, ly = (b.y || 0) + a.dy;
    const cr = Math.cos(par.rot), sr = Math.sin(par.rot);
    W[b.name] = {
      x: par.x + lx * cr - ly * sr,
      y: par.y + lx * sr + ly * cr,
      rot: par.rot + a.rot * Math.PI / 180,
    };
  }
  return W;
}
function hiddenSlots(ck, animName, t) {
  const v = (VIS[ck] || {})[animName];
  if (!v) return null;
  const h = new Set();
  for (const slot in v) {
    const w = v[slot];
    if (t < w[0] || t > w[1]) h.add(slot);
  }
  return h;
}
function drawRig(g, C, W, ox, oy, s, hidden) {
  for (const sl of C.cfg.slots) {
    if (hidden && hidden.has(sl.name)) continue;
    const at = C.cfg.attachments[sl.name], bw = W[sl.bone], img = C.imgs[sl.name];
    if (!img || !img.complete) continue;
    const cr = Math.cos(bw.rot), sr = Math.sin(bw.rot);
    const wx = bw.x + at.x * cr - at.y * sr;
    const wy = bw.y + at.x * sr + at.y * cr;
    g.save();
    g.translate(ox + wx * s, oy - wy * s);
    g.rotate(-bw.rot);
    g.drawImage(img, -at.width / 2 * s, -at.height / 2 * s,
                at.width * s, at.height * s);
    g.restore();
  }
}
const CTX = { sp: document.getElementById('cv_sp').getContext('2d'),
              ar: document.getElementById('cv_ar').getContext('2d') };
function frame(now) {
  for (const ck in CHARS) {
    const C = CHARS[ck], g = CTX[ck];
    const anim = C.anims[C.cur], dur = duration(anim);
    const t = ((now - C.t0) / 1000) % dur;
    const W = worldTransforms(C, pose(C, anim, t));
    g.imageSmoothingEnabled = false;
    g.fillStyle = '#33402a'; g.fillRect(0, 0, 380, 330);
    drawRig(g, C, W, 150, 315, 1.0, hiddenSlots(ck, C.cur, t));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
for (const ck in CHARS) {
  const holder = document.getElementById('btns_' + ck);
  for (const nm of ['idle', 'walk', 'attack']) {
    const b = document.createElement('button');
    b.textContent = nm;
    if (nm === 'idle') b.classList.add('on');
    b.onclick = () => {
      CHARS[ck].cur = nm; CHARS[ck].t0 = performance.now();
      holder.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
    };
    holder.appendChild(b);
  }
}
window.__grab = async (ck, anim, times, tag) => {
  const C = CHARS[ck];
  const cw = 240, chh = 330;
  const c = document.createElement('canvas');
  c.width = times.length * cw; c.height = chh;
  const g = c.getContext('2d');
  g.fillStyle = '#33402a'; g.fillRect(0, 0, c.width, c.height);
  times.forEach((tt, i) => {
    const W = worldTransforms(C, pose(C, C.anims[anim], tt));
    drawRig(g, C, W, 110 + i * cw, 315, 1.0, hiddenSlots(ck, anim, tt));
    g.fillStyle = '#e8e4d8'; g.font = '12px Menlo';
    g.fillText(ck + ' ' + anim + ' t=' + tt.toFixed(2), 8 + i * cw, 16);
  });
  return new Promise(r => c.toBlob(b =>
    fetch('/shot?name=' + tag, { method: 'POST', body: b }).then(() => r(tag))));
};
