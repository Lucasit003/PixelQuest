function bez(c, x) {
  // cubic bezier y-for-x, control [x1,y1,x2,y2], endpoints (0,0)-(1,1)
  let lo = 0, hi = 1;
  for (let i = 0; i < 22; i++) {
    const m = (lo + hi) / 2;
    const u = 1 - m;
    const px = 3*u*u*m*c[0] + 3*u*m*m*c[2] + m*m*m;
    if (px < x) lo = m; else hi = m;

  const m = (lo + hi) / 2, u = 1 - m;
  return 3*u*u*m*c[1] + 3*u*m*m*c[3] + m*m*m;

function sample(kfs, t, field) {

  for (let i = 0; i < kfs.length - 1; i++) {
    const a = kfs[i], b = kfs[i+1];

      const span = b.time - a.time || 1e-6;
      const f = bez(a.curve || [0.25,0,0.75,1], (t - a.time) / span);
      const av = a[field] ?? 0, bv = b[field] ?? 0;

  }
}
const cv = document.getElementById('cv').getContext('2d');
const gv = document.getElementById('game').getContext('2d');
cv.imageSmoothingEnabled = false;
function frame(now) {
  const anim = ANIMS[cur], dur = duration(anim);
  let t = ((now - t0) / 1000 * speed) % dur;
  const W = worldTransforms(pose(anim, t));
  cv.clearRect(0, 0, 340, 300);
  cv.fillStyle = '#3a4a2c'; cv.fillRect(0, 0, 340, 300);
  drawRig(cv, W, 150, 285, 1.5);
  // game-scale: render at 0.1156 (=20px body) into offscreen then blit x3
  gv.imageSmoothingEnabled = true;
  gv.clearRect(0, 0, 120, 100);
  gv.fillStyle = '#3a4a2c'; gv.fillRect(0, 0, 120, 100);
  const off = document.createElement('canvas');
  off.width = 40; off.height = 33;
  const og = off.getContext('2d');
  og.imageSmoothingEnabled = true;
  drawRig(og, W, 16, 31, 0.1156);
  gv.imageSmoothingEnabled = false;
  gv.drawImage(off, 0, 0, 40, 33, 0, 0, 120, 99);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
for (const [id, nm] of [['b_idle','idle'],['b_quick','attack_quick'],['b_lunge','attack_lunge']]) {
  document.getElementById(id).onclick = () => {
    cur = nm; t0 = performance.now();
    document.querySelectorAll('button').forEach(b => b.classList.remove('on'));
    document.getElementById(id).classList.add('on');
  };
}
document.getElementById('speed').oninput = (e) => { speed = e.target.value / 100; };
// deterministic frame render + POST for validation
window.__grab = async (anim, times, tag) => {
  const c = document.createElement('canvas');
  c.width = times.length * 230; c.height = 300;
  const g = c.getContext('2d');
  g.fillStyle = '#3a4a2c'; g.fillRect(0, 0, c.width, c.height);
  times.forEach((tt, i) => {
    const W = worldTransforms(pose(ANIMS[anim], tt));
    drawRig(g, W, 110 + i * 230, 285, 1.35);
    g.fillStyle = '#e8e4d8'; g.font = '12px Menlo';
    g.fillText(anim + ' t=' + tt.toFixed(2), 12 + i * 230, 16);
  });
  return new Promise(r => c.toBlob(b =>
    fetch('/shot?name=' + tag, { method: 'POST', body: b }).then(() => r(tag))));
};
